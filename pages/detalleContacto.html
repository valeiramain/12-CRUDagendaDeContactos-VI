<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Practica de operaciones del CRUD con una agenda" />
    <link rel="stylesheet" href="../css/bootstrap.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <meta name="author" content="Valentina Iramain" />
    <title>Agenda de contactos</title>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container">
                <a class="navbar-brand" href="../index.html">Agenda de contactos</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="../index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="./error404.html">Contacto</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main class="container my-4">
        <h1 class="text-center my-4">Detalle del Contacto</h1>
        <section>
            <div class="card mb-3">
                <div class="row g-0">
                    <div class="col-md-4">
                        <img src="../img/persona1.jpg" class="img-fluid rounded-start" alt="Foto Personal">
                    </div>
                    <div class="col-md-8">
                        <div class="card-body">
                            <form>
                                <div class="mb-3">
                                    <label for="nombre" class="form-label">Nombre</label>
                                    <input type="text" class="form-control bg-body-tertiary text-dark" id="nombre"
                                        aria-describedby="label nombre" minlength="2" maxlength="50" placeholder="Juan"
                                        disabled />
                                </div>
                                <div class="mb-3">
                                    <label for="apellido" class="form-label">Apellido</label>
                                    <input type="text" class="form-control bg-body-tertiary text-dark" id="apellido"
                                        minlength="2" maxlength="50" placeholder=Perez disabled />
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" class="form-control bg-body-tertiary text-dark" id="email"
                                        placeholder="juanperez@email.com" disabled />
                                </div>
                                <div class="mb-3">
                                    <label for="telefono" class="form-label">Telefono</label>
                                    <input type="tel" class="form-control bg-body-tertiary text-dark" id="telefono"
                                        placeholder="ej: +5493081225566" disabled />
                                </div>
                                <div class="mb-3">
                                    <label for="imagen" class="form-label">Imágen</label>
                                    <input type="text" class="form-control bg-body-tertiary text-dark" id="imagen"
                                        placeholder="http://imagen.jpg" disabled />
                                </div>
                                <div class="mb-3">
                                    <label for="notas" class="form-label">Notas</label>
                                    <textarea class="form-control bg-body-tertiary text-dark" id="notas" maxlength="250"
                                        placeholder="agrega tus notas aqui" disabled></textarea>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-dark text-center py-4">
        <p>&copy; Todos los derechos reservados</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
    <script src="../js/detalleContacto.js"></script>
</body>

</html>
